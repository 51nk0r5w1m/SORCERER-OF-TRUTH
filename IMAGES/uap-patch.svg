<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="320" height="420">
  <defs>
    <style>
      text { font-family: 'Space Mono', monospace; fill: #a1a1aa; }
      .bright { fill: #f0ede4; }
      .dim { fill: #52525b; }
      .accent { fill: #39ff14; }
      .red { fill: #ef4444; }
    </style>
  </defs>

  <!-- Outer frame -->
  <rect x="1" y="1" width="318" height="418" fill="#050507" stroke="#3f3f46" stroke-width="1"/>
  <!-- Inner frame -->
  <rect x="8" y="8" width="304" height="404" fill="none" stroke="#27272a" stroke-width="1"/>

  <!-- Top designation bar -->
  <line x1="8" y1="36" x2="312" y2="36" stroke="#3f3f46" stroke-width="1"/>
  <text x="16" y="26" font-size="8" class="dim">SRC/TRUTH</text>
  <text x="160" y="26" font-size="8" class="dim" text-anchor="middle">—◇—</text>
  <text x="304" y="26" font-size="8" class="dim" text-anchor="end">DFCN-34</text>

  <!-- Unit title block -->
  <text x="160" y="58" font-size="7" letter-spacing="6" text-anchor="middle" class="dim">ANOMALOUS SIGNALS DIVISION</text>
  <text x="160" y="80" font-size="16" font-weight="700" letter-spacing="2" text-anchor="middle" class="bright">UAP PLATFORM</text>
  <text x="160" y="100" font-size="16" font-weight="700" letter-spacing="2" text-anchor="middle" class="bright">ENGINEERING</text>
  <line x1="40" y1="110" x2="280" y2="110" stroke="#27272a" stroke-width="1"/>

  <!-- Central instrument: UFO silhouette as schematic -->
  <g transform="translate(160,175)">
    <!-- Crosshair -->
    <line x1="-60" y1="0" x2="-20" y2="0" stroke="#27272a" stroke-width="1"/>
    <line x1="20" y1="0" x2="60" y2="0" stroke="#27272a" stroke-width="1"/>
    <line x1="0" y1="-60" x2="0" y2="-20" stroke="#27272a" stroke-width="1"/>
    <line x1="0" y1="20" x2="0" y2="60" stroke="#27272a" stroke-width="1"/>

    <!-- Concentric tracking rings -->
    <circle cx="0" cy="0" r="52" fill="none" stroke="#27272a" stroke-width="1" stroke-dasharray="2 4"/>
    <circle cx="0" cy="0" r="36" fill="none" stroke="#3f3f46" stroke-width="1"/>

    <!-- UFO schematic — dome -->
    <path d="M-5 -12 Q0 -22 5 -12" fill="none" stroke="#f0ede4" stroke-width="1.5"/>
    <!-- Hull -->
    <ellipse cx="0" cy="-8" rx="18" ry="6" fill="none" stroke="#f0ede4" stroke-width="1.5"/>
    <!-- Beam lines -->
    <line x1="-10" y1="-3" x2="-22" y2="36" stroke="#39ff14" stroke-width="1" opacity="0.7"/>
    <line x1="10" y1="-3" x2="22" y2="36" stroke="#39ff14" stroke-width="1" opacity="0.7"/>
    <line x1="0" y1="-2" x2="0" y2="40" stroke="#39ff14" stroke-width="1" stroke-dasharray="2 3" opacity="0.5"/>
    <!-- Beam floor -->
    <ellipse cx="0" cy="38" rx="24" ry="4" fill="none" stroke="#39ff14" stroke-width="1" opacity="0.4"/>

    <!-- Signal arcs -->
    <path d="M-28 -18 Q-34 -6 -28 6" fill="none" stroke="#a1a1aa" stroke-width="1" opacity="0.4"/>
    <path d="M28 -18 Q34 -6 28 6" fill="none" stroke="#a1a1aa" stroke-width="1" opacity="0.4"/>

    <!-- Tracking dots -->
    <circle cx="-36" cy="-36" r="2" fill="#39ff14" opacity="0.6"/>
    <circle cx="40" cy="28" r="2" fill="#39ff14" opacity="0.4"/>
    <circle cx="-20" cy="44" r="1.5" fill="#39ff14" opacity="0.3"/>
  </g>

  <!-- Corner brackets on instrument area -->
  <path d="M32 120 L32 128 L40 128" fill="none" stroke="#3f3f46" stroke-width="1"/>
  <path d="M288 120 L288 128 L280 128" fill="none" stroke="#3f3f46" stroke-width="1"/>
  <path d="M32 230 L32 222 L40 222" fill="none" stroke="#3f3f46" stroke-width="1"/>
  <path d="M288 230 L288 222 L280 222" fill="none" stroke="#3f3f46" stroke-width="1"/>

  <!-- Divider -->
  <line x1="16" y1="240" x2="304" y2="240" stroke="#27272a" stroke-width="1"/>

  <!-- Data readout block — pipe-delimited instrument style -->
  <text x="20" y="260" font-size="8" class="dim">| OPERATOR</text>
  <text x="300" y="260" font-size="8" class="bright" text-anchor="end">C. FANT |</text>

  <text x="20" y="278" font-size="8" class="dim">| CLEARANCE</text>
  <text x="300" y="278" font-size="8" class="accent" text-anchor="end">RFC/NIST |</text>

  <text x="20" y="296" font-size="8" class="dim">| PIPELINE</text>
  <text x="300" y="296" font-size="8" class="bright" text-anchor="end">PROVENANCE |</text>

  <text x="20" y="314" font-size="8" class="dim">| DOMAIN</text>
  <text x="300" y="314" font-size="8" class="bright" text-anchor="end">APPSEC/IAM |</text>

  <text x="20" y="332" font-size="8" class="dim">| STATUS</text>
  <text x="300" y="332" font-size="8" class="accent" text-anchor="end">ACTIVE |</text>

  <!-- Bottom divider -->
  <line x1="16" y1="345" x2="304" y2="345" stroke="#27272a" stroke-width="1"/>

  <!-- Motto -->
  <text x="160" y="365" font-size="9" font-weight="700" letter-spacing="3" text-anchor="middle" class="bright">TRUST BUT VERIFY</text>
  <text x="160" y="380" font-size="9" font-weight="700" letter-spacing="3" text-anchor="middle" class="accent">THE TRUST</text>

  <!-- Bottom barcode / classification -->
  <g transform="translate(60,392)">
    <rect x="0" y="0" width="2" height="12" fill="#3f3f46"/>
    <rect x="4" y="0" width="1" height="12" fill="#3f3f46"/>
    <rect x="7" y="0" width="3" height="12" fill="#3f3f46"/>
    <rect x="12" y="0" width="1" height="12" fill="#3f3f46"/>
    <rect x="15" y="0" width="2" height="12" fill="#3f3f46"/>
    <rect x="19" y="0" width="1" height="12" fill="#3f3f46"/>
    <rect x="22" y="0" width="3" height="12" fill="#3f3f46"/>
    <rect x="27" y="0" width="1" height="12" fill="#3f3f46"/>
    <rect x="30" y="0" width="2" height="12" fill="#3f3f46"/>
    <rect x="34" y="0" width="1" height="12" fill="#3f3f46"/>
    <rect x="37" y="0" width="3" height="12" fill="#3f3f46"/>
    <rect x="42" y="0" width="1" height="12" fill="#3f3f46"/>
    <rect x="45" y="0" width="2" height="12" fill="#3f3f46"/>
  </g>
  <text x="160" y="414" font-size="6" class="dim" text-anchor="middle">2026.08.09 · LV · W3</text>
</svg>
