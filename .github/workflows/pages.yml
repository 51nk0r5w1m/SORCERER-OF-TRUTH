name: Deploy Sorcerer of Truth

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Establish daily snapshot key
        id: snapshot
        run: echo "date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
      - name: Cache Observable data snapshots
        uses: actions/cache@v4
        with:
          path: dashboard/src/.observablehq/cache
          key: observable-data-${{ hashFiles('dashboard/src/data/**') }}-${{ steps.snapshot.outputs.date }}
      - run: npm ci
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard
      - name: Assemble Cohesive Site
        run: |
          mkdir -p _site/dashboard
          cp index.html _site/index.html
          touch _site/.nojekyll
          touch _site/dashboard/.nojekyll
          if [ -d prototypes ]; then cp -r prototypes _site/; fi
          if [ -d public ]; then cp -r public _site/; fi
          if [ -f DEEP-RESEARCH.MD ]; then cp DEEP-RESEARCH.MD _site/; fi
          if [ -f STORYTELLING_PHYSICS.md ]; then cp STORYTELLING_PHYSICS.md _site/; fi
          cp -r dashboard/dist/* _site/dashboard/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
